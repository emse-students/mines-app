[package]
name = "chat-gateway"
version = "0.16.6-alpha.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "1.0.2", features = ["tokio-comp"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "cors"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }
jsonwebtoken = { version = "11.0.0", features = ["use_pem", "rust_crypto"] }
reqwest = { version = "0.13.3", features = ["json"] }
bytes = "1"
base64 = "0.23"

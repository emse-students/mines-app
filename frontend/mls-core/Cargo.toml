[package]
name = "mls-core"
version = "0.16.4"
edition = "2024"

[dependencies]
openmls = { version = "0.8.1", features = ["js"] }
openmls_rust_crypto = "0.5.1"
openmls_traits = "0.5.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

argon2 = "0.6"
chacha20poly1305 = "0.11"
rand = "0.10"
base64 = "0.23"
thiserror = "2.0.18"
ciborium = "0.2.2"
openmls_basic_credential = "0.5.0"
log = "0.4.29"
zeroize = { version = "1", features = ["zeroize_derive"] }

[features]
test-keystore = []

[dev-dependencies]
# Already a runtime dependency; the integration test `state_weight` re-reads a saved state to
# weigh it by storage label, which needs the same decoder the writer used.
ciborium = "0.2.2"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "mls_perf"
harness = false
path = "benches/mls_perf.rs"

# =================================================================================================
# PACKAGE 1 OF 2: EVERYTHING THAT HAPPENS WHEN A PULL REQUEST IS OPENED
#
# IT IS `ci.yml` IN ALL FOUR REPOSITORIES SINCE 2026-09-04. This was `pull-request.yml` here, and
# the name had stopped being true: the file runs on `push: main` and on `workflow_dispatch` as well,
# and the verdict it leaves on a `main` commit is what `release-preflight.sh` reads before it lets a
# release start. The workflow's NAME was already `CI` and the required check is `ci-passed`, so
# nothing outside this repository ever saw the old file name - which is exactly why it could drift.
#
# `release.yml` is the other one. Between them they are the whole delivery cycle, and the split is
# the human gesture that starts each (user, 2026-09-03: *"Je veux une suite d'evenements et
# d'etapes. Un paquet qui suit la soumission d'une PR, un qui suit la publication d'une pre-release,
# et un qui suit la publication d'une release"*).
#
# THE SEQUENCE, IN ORDER, AND IT IS THE WHOLE FILE:
#
#   1. `changes`         reads the modified paths and decides which of the jobs below run at all
#   2. the test jobs     Rust, the four NestJS apps' real AppModule, TS, frontend, the two
#                        self-test suites - in parallel, each behind its own path filter
#   2b `dependency-      ONLY on a Dependabot pull request: does a gate HERE exist that would see
#      ceiling`          this update fail? A human's pull request carries no `updated-dependencies`
#                        block to decide on, so it skips
#   2c `security`        CodeQL, the secret scan and the vulnerability audit, called from
#                        `code-analysis.yml`. NOT behind `changes`: a secret can be committed in a
#                        documentation change
#   3. `ci-passed`       aggregates them. `success` AND `skipped` both pass; it is the ONE check
#                        the branch ruleset requires, and the only one it could require
#
# ARMING THE MERGE IS NOT HERE, AND THAT MOVED ON 2026-09-04. It was a job of this file, and it
# could only ever cover HUMAN pull requests: a `pull_request` run from Dependabot gets no secrets,
# so no App token can be minted in this context. That forced a second mechanism - a 448-line hourly
# sweep - to arm the other half of the population. `arm-auto-merge.yml` runs on
# `pull_request_target`, which has the base repository's secrets, and covers every pull request in
# one file. It checks nothing out, which is what makes that trigger safe there and would make it
# unsafe here.
#
# Then GitHub squash-merges, deletes the branch, and the merge raises a `push` - which runs this
# same file again on the merged `main`. That second run is not decoration: it is what puts the
# `CI passed` check ON the commit of `main`, and `release-preflight.sh`'s third gate reads exactly
# that check. A merge whose event never fires is a commit no release can be cut from.
#
# WHY BOTH TRIGGERS. `pull_request` tests the SYNTHESISED MERGE COMMIT - two pull requests that each
# pass can still break `main` between them. `push` on `main` says whether the merged result is
# green, and covers the one case a required check cannot: an admin bypassing the ruleset for an
# emergency hotfix still gets told, on `main`, what the bypass skipped.
#
# NOTHING HERE DEPLOYS. Deployment happens when a release is published, so a red run on `main` is a
# statement about the repository, never about production - which is still serving the last release.
# =================================================================================================
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Kept for a hand re-run of the suite on `main` after an infrastructure fault. It used to exist
  # for the hourly sweep, whose `GITHUB_TOKEN` merges raised no `push` event and therefore never
  # tested the merged COMBINATION; the sweep is gone and every merge is now made by the App, whose
  # push does raise the event.
  workflow_dispatch:
  # NO `workflow_call`, DELETED 2026-09-04 WITH ITS `git_ref` INPUT: nothing called it. It was the
  # sweep's way of testing a merged combination its `GITHUB_TOKEN` merge had raised no `push` for,
  # and every checkout below carried a `inputs.git_ref != '' && inputs.git_ref || github.sha` that
  # resolved to `github.sha` on every real run this repository has ever had. A trigger nothing uses
  # is a claim the file makes about itself that is not true, and six expressions were written around
  # it.

env:
  CARGO_TERM_COLOR: always

jobs:
  # =================================================================================================
  # CHANGE DETECTION
  # Only test components affected by the current changeset.
  # =================================================================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust-matrix: ${{ steps.matrix.outputs.rust }}
      ts-matrix: ${{ steps.matrix.outputs.ts }}
      run-frontend: ${{ steps.matrix.outputs.frontend }}
      run-harness: ${{ steps.matrix.outputs.harness }}
      run-scripts: ${{ steps.matrix.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build test matrices
        id: matrix
        run: |
          set -euo pipefail

          # ── Full matrices (used as fallback) ──
          ALL_RUST='[{"name":"Chat Gateway","path":"apps/chat-gateway","cmd":"cargo test","check":true},{"name":"Call Service (SFU)","path":"apps/call-service","cmd":"cargo test","check":true},{"name":"Frontend MLS Core","path":"frontend/mls-core","cmd":"cargo test","check":true},{"name":"Frontend MLS WASM","path":"frontend/mls-wasm","cmd":"cargo build --target wasm32-unknown-unknown --release","wasm":true,"check":true},{"name":"Frontend Native (Tauri)","path":"frontend/src-tauri","cmd":"cargo test --all-targets","tauri":true,"fmt":true}]'
          ALL_TS='["apps/core-service","apps/social-service","apps/chat-delivery-service","apps/media-service"]'

          run_all() {
            echo "rust=$ALL_RUST"    >> "$GITHUB_OUTPUT"
            echo "ts=$ALL_TS"        >> "$GITHUB_OUTPUT"
            echo "frontend=true"     >> "$GITHUB_OUTPUT"
            echo "harness=true"      >> "$GITHUB_OUTPUT"
            echo "scripts=true"      >> "$GITHUB_OUTPUT"
          }

          # ── Determine base commit ──
          BASE=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" ]] && \
               [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE="${{ github.event.before }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD~1)"
          fi

          if [[ -z "$BASE" ]]; then
            echo "No base commit available - running all tests."
            run_all; exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "Changed files:" && echo "$CHANGED"

          # Helper: returns 0 if any changed file matches the pattern
          has() { echo "$CHANGED" | grep -qE "$1"; }

          # CI workflow itself changed → test everything
          if has '\.github/workflows/pull-request\.yml'; then
            echo "CI workflow changed - running all tests."
            run_all; exit 0
          fi

          # ── Rust matrix ──
          rust=()
          # chat-gateway generates its protobufs from `libs/proto`; since `libs/shared-rust`
          # was deleted on 2026-08-31 that is its ONLY path dependency inside this repo.
          if has '^libs/proto/' || has '^apps/chat-gateway/'; then
            rust+=('{"name":"Chat Gateway","path":"apps/chat-gateway","cmd":"cargo test","check":true}')
          fi
          # THE SFU, WHICH NOTHING HERE COMPILED UNTIL 2026-08-27 - the same hole as the native
          # crate below, found the same way. `apps/call-service` was in no matrix at all, so the
          # ONLY thing that ever built it was the Docker stage in `deploy.yml`, which runs AFTER a
          # merge. Two Dependabot majors went green through that gap and landed on `main` broken:
          # #222 (webrtc 0.11 -> 0.17, which deleted `RTCIceServer::credential_type`) and #227
          # (axum 0.7 -> 0.8, whose text frames became `Utf8Bytes`). The failure surfaced as a red
          # CD and a skipped deploy, which is far too late and one step from a release.
          # WITH `check`: `cargo fmt --check` and `clippy --all-targets --all-features -D warnings`
          # were both run against this crate before this entry was added, and both are clean - it
          # is not on an unverified guess, unlike the deliberate omission noted for Tauri below.
          # It has no path dependency on anything in this repo, so only its own sources trigger it.
          if has '^apps/call-service/'; then
            rust+=('{"name":"Call Service (SFU)","path":"apps/call-service","cmd":"cargo test","check":true}')
          fi

          mls_core=false
          if has '^frontend/mls-core/'; then mls_core=true; fi
          if [[ "$mls_core" == "true" ]]; then
            rust+=('{"name":"Frontend MLS Core","path":"frontend/mls-core","cmd":"cargo test","check":true}')
          fi
          # mls-wasm depends on mls-core
          if [[ "$mls_core" == "true" ]] || has '^frontend/mls-wasm/'; then
            rust+=('{"name":"Frontend MLS WASM","path":"frontend/mls-wasm","cmd":"cargo build --target wasm32-unknown-unknown --release","wasm":true,"check":true}')
          fi
          # AND SO DOES THE NATIVE CRATE, WHICH NOTHING HERE COMPILED UNTIL 2026-08-23. A variant
          # added to `mls_core::DecryptErrorKind` broke `src-tauri`'s exhaustive match, and every
          # gate stayed green: CI has no matrix entry for it, and the only workflows that build it
          # are the three release ones - so the break would have surfaced at a release, which is the
          # worst possible moment and exactly the shipping-order hazard `legacy-compatibility.md`
          # is about. Triggered by its own sources AND by mls-core, because that is the direction
          # the dependency runs.
          #
          # DELIBERATELY WITHOUT `check` - no `cargo fmt`/`clippy -D warnings` gate yet. Both were
          # verified by hand on Windows the day this was added; neither has ever run against this
          # crate on Linux with `--all-features`, and turning a gate on for everybody on an
          # unverified guess is how a pipeline goes red for a reason nobody changed.
          #
          # IT RUNS THE TESTS NOW, AND UNTIL 2026-08-31 IT DID NOT. `cargo check --all-targets` was
          # the exact scope of the defect that prompted the entry - does it compile - and it stayed
          # that scope after the crate acquired 33 tests, so every one of them was COMPILED and none
          # was ever RUN by anything but a developer's machine. That is the house rule about native
          # code written into the pipeline itself: verifying by compiling proves nothing about
          # running. `cargo test --all-targets` strictly dominates the old command - it still
          # compiles every target - and it is what makes `cross_version_push.rs`, the gate that
          # retired the `aes-gcm` ceiling clause, an actual gate rather than a file that compiles.
          # The webkit2gtk install below is what lets the test binary LINK on Linux; it was already
          # there for the check.
          if [[ "$mls_core" == "true" ]] || has '^frontend/src-tauri/'; then
            rust+=('{"name":"Frontend Native (Tauri)","path":"frontend/src-tauri","cmd":"cargo test --all-targets","tauri":true,"fmt":true}')
          fi

          if [[ ${#rust[@]} -eq 0 ]]; then
            echo "rust=[]" >> "$GITHUB_OUTPUT"
          else
            echo "rust=[$(IFS=,; echo "${rust[*]}")]" >> "$GITHUB_OUTPUT"
          fi

          # ── TypeScript backend matrix ──
          ts=()
          if has '^apps/core-service/'; then
            ts+=('"apps/core-service"')
          fi
          if has '^apps/social-service/'; then
            ts+=('"apps/social-service"')
          fi
          if has '^apps/chat-delivery-service/'; then
            ts+=('"apps/chat-delivery-service"')
          fi
          if has '^apps/media-service/'; then
            ts+=('"apps/media-service"')
          fi

          if [[ ${#ts[@]} -eq 0 ]]; then
            echo "ts=[]" >> "$GITHUB_OUTPUT"
          else
            echo "ts=[$(IFS=,; echo "${ts[*]}")]" >> "$GITHUB_OUTPUT"
          fi

          # ── Frontend ──
          if has '^frontend/src/' || has '^frontend/static/' || \
             has '^frontend/package\.json' || has '^frontend/svelte\.config' || \
             has '^frontend/vite\.config' || has '^frontend/vitest\.config' || \
             has '^frontend/tsconfig' || has '^frontend/\.oxlintrc' || has '^oxfmt\.json' || has '^\.oxlintrc' || has '^rust-toolchain\.toml' || has '^scripts/install-oxvelte\.sh' || \
             has '^frontend/mls-wasm/' || has '^frontend/mls-core/' || has '^libs/proto/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # -- Cross-client harness self-tests --
          # They read the rig's own sources and nothing else, so this path is the whole trigger.
          if has '^tools/cross-client-harness/'; then
            echo "harness=true" >> "$GITHUB_OUTPUT"
          else
            echo "harness=false" >> "$GITHUB_OUTPUT"
          fi

          # -- CI script self-tests --
          # `.github/scripts/` decides which Dependabot pull requests merge unattended, so its own
          # sources are the whole trigger. Note it is NOT reached by the `ci.yml` short-circuit at
          # the top of this step: a change to a script is not a change to this workflow.
          #
          # AND ITS OWN SOURCES ARE NOT THE WHOLE TRIGGER ANY MORE, because one of those self-tests
          # is DERIVED. `tests/ceiling.test.sh` reads `docker-compose.prod.yml` and demands the
          # auto-merge ceiling name every third-party image mounting a named volume - so the pull
          # request that ADDS a stateful service is the one case the assertion exists for, and it was
          # the one case that did not run it. The compose file is part of the input, so it is part of
          # the trigger; the `Makefile` is here because it decides WHICH self-tests run at all
          # (`test-ci-scripts` executed only one of the two until 2026-09-01).
          # `tests/compose-wiring.test.sh` is derived the same way and reads BOTH deployed compose
          # files, so the dev one joins the trigger: the whole reason that test exists is that a
          # compose file was wrong for four months with nothing reading it. **And since 2026-09-02 it
          # reads a THIRD file, `infrastructure/local/docker-compose.yml`, deriving from
          # `docker-compose.prod.yml` every environment key the local estate is owed - 17 were
          # missing, three of them the `AUTHENTIK_*` trio, so no local login could complete. That
          # file is an input, so `local/` is in the pattern below; it was not, for one commit, which
          # is the exact shape this comment warns about.
          #
          # `scripts/bump-app-version.sh` IS AN INPUT AND DOES NOT LIVE UNDER `.github/` AT ALL.
          # `tests/bump-version.test.sh` runs that script in a sandbox and reads the manifests back,
          # so the commit that must run it is a change to the script - the one file the first
          # pattern here would never match.
          #
          # EVERY `.md` FILE IN THE REPOSITORY IS AN INPUT, because of `tests/wiki-links.test.mjs`.
          # It walks all of them and asserts that every intra-repository link resolves - the file
          # AND the heading anchor. The commit that breaks such a link is a heading RENAME, which
          # touches only the target page, so any narrower pattern would pass on exactly the commit
          # that breaks it. That is the same shape as the two entries below and the one above, and
          # it is the reason this list keeps growing rather than being tidied into a prefix.
          #
          # THE FOUR RELEASE WORKFLOWS ARE INPUTS, and they are the least obvious entries here.
          # `tests/deploy-env.test.sh` derives the expected key set of a deployed environment FROM
          # `deploy.yml`'s own
          # `upsert_env_var` calls - so the change that must run it is a key added THERE and not to
          # `infrastructure/deploy/env-manifest.tsv`. A derived test whose source sits outside its
          # own trigger is a test that passes on the very commit that breaks it. `.env.example` joins
          # for the same reason: it is the template every rendered .env is built from.
          #
          # `release.yml`, `android.yml` and `ios.yml` are there because `tests/release-chain.test.sh`
          # READS ALL FOUR: it asserts the release still has the shape the three human gestures
          # require - one entry point, the gates before the bump, the bump before every arm, and no
          # arm resolving `main` for itself. Every defect that chain has actually had was a wiring
          # defect rather than a bug in a script, so the files themselves are the test's subject.
          # `bump-staging.test.sh` reads `release.yml` too, for how the bump stages its commit.
          #
          # AND `tools/app-store/` IS AN INPUT, for the same reason `scripts/bump-app-version.sh` is:
          # its self-test lives beside it rather than under `.github/`, and the release preflight
          # calls `submit.mjs --check-notes` as its fifth gate. So the commit that must run it is a
          # change to the submission script - which the first pattern here would never match.
          #
          # SO IS `tools/store-divergence/`, and so are the THREE estate workflows. This list named
          # `deploy.yml` until 2026-09-07 - a file that no longer exists - and named none of the
          # three that replaced it, so a change to the PRODUCTION ESTATE would not have run the
          # suite that guards it. A pattern is only evidence for the tree it was written against.
          if has '^\.github/scripts/' \
            || has '^tools/app-store/' \
            || has '^tools/store-divergence/' \
            || has '^infrastructure/(docker-compose\.(prod|dev)\.yml|dev/|local/|deploy/|\.env\.example)' \
            || has '^\.github/workflows/(release|build|serve-dev|serve-prod|android|ios|scheduled)\.yml$' \
            || has '^scripts/bump-app-version\.sh$' \
            || has '\.md$' \
            || has '^Makefile'; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts=false" >> "$GITHUB_OUTPUT"
          fi

  # =================================================================================================
  # RUST MATRIX
  # =================================================================================================
  test-rust:
    name: Test Rust (${{ matrix.component.name }})
    needs: [changes]
    if: ${{ needs.changes.outputs.rust-matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.rust-matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake libcurl4-openssl-dev pkg-config

      - name: Install WASM target
        if: matrix.component.wasm == true
        run: rustup target add wasm32-unknown-unknown

      # Only for the native crate: webkit2gtk and friends are a heavy install and no other
      # component needs them, so this mirrors the WASM-target step above rather than widening the
      # shared dependency step.
      - name: Install Tauri system dependencies (Linux)
        if: matrix.component.tauri == true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev

      # The bun side of this repo has been installed with `--frozen-lockfile` since day one; the
      # Rust side had NOTHING. Nothing read the committed `Cargo.lock` at all, so cargo silently
      # regenerated it on every run and every gate was green about a graph the repository does not
      # describe. On 2026-08-31 two of the five locks were drifted at `main`, and one of the two
      # carried TWO copies of `openmls_traits` (0.5.0 and 0.6.0) - a Dependabot bump of a crate the
      # code never used, which by itself cannot fail to compile and so was invisible to `cargo test`.
      #
      # `cargo metadata --locked` resolves the graph and refuses to write, which is exactly the
      # question: does the committed lock still satisfy the manifests? It is ONE step for every
      # component instead of a `--locked` appended to five `cmd` strings that live in JSON in three
      # different places - the same gate, stated once. It also covers the Tauri crate, which is
      # deliberately outside the `check` gate below.
      #
      # `mls-core` commits no lock ON PURPOSE - it is only ever consumed as a dependency and
      # resolves inside its consumer's lock, as `.gitignore` says next to the `*.lock` rule. It is
      # not skipped silently: the change filter above fans any `mls-core` change out to `mls-wasm`
      # AND `src-tauri`, so its graph is asserted twice, in the two locks that actually ship.
      - name: Refuse a lockfile the manifests no longer describe
        working-directory: ${{ matrix.component.path }}
        run: |
          if [[ ! -f Cargo.lock ]]; then
            echo "no committed Cargo.lock here by design - asserted through this crate's consumers"
            exit 0
          fi
          cargo metadata --locked --format-version 1 > /dev/null

      # `fmt` is a SEPARATE flag from `check`, and src-tauri is why. The comment on that matrix entry
      # refuses `check` because neither `cargo fmt` nor `clippy -D warnings` had ever run against the
      # crate on Linux with `--all-features`, and an unverified gate turns a pipeline red for a
      # reason nobody changed. That caution is right about CLIPPY and does not apply to RUSTFMT:
      # rustfmt parses source files, it resolves no features and compiles nothing, so the platform
      # and the feature set cannot change its answer. Measured on 2026-09-02 before flipping it:
      # `cargo fmt -- --check` in `frontend/src-tauri` exits 0 as the tree stands.
      #
      # IT IS HERE BECAUSE `.husky/pre-push` WAS DELETED THE SAME DAY. That hook ran exactly this
      # command on exactly this crate - "fmt --check alone: src-tauri's clippy compiles the whole app
      # plus deps, too heavy for a hook" - and it was the only thing that did. Removing the hook
      # without moving its one unique gate here would have opened the hole that the hook's own
      # comments were written to close.
      - name: Check Formatting
        if: matrix.component.check == true || matrix.component.fmt == true
        working-directory: ${{ matrix.component.path }}
        run: cargo fmt -- --check

      - name: Lint with Clippy
        if: matrix.component.check == true
        working-directory: ${{ matrix.component.path }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Component Task
        working-directory: ${{ matrix.component.path }}
        run: ${{ matrix.component.cmd }}

  # =================================================================================================
  # THE REAL APPLICATION, BOOTED
  # =================================================================================================
  # `src/framework-boot.spec.ts` runs in the matrix above and proves the HTTP framework packages
  # cohere. It cannot prove more than that: its probe module imports nothing, so every dynamic module
  # a service actually uses - `TypeOrmModule.forRoot`, `ConfigModule`, `ThrottlerModule`,
  # `ScheduleModule` - is covered there only by the peer range it happens to declare.
  #
  # THIS JOB CONSTRUCTS THE ACTUAL `AppModule`. Until 2026-08-31 nothing in this repository ever did:
  # `NestFactory` appeared in four files and all four were a `main.ts`. That is the gate a
  # `@nestjs/platform-express` 11 -> 12 auto-merge walked straight through, and it is the gate
  # the ceiling names when it refuses a framework major - so this job is what
  # eventually lets those merge on their own.
  #
  # IT NEEDS REAL INFRASTRUCTURE, AND THE LIST WAS MEASURED RATHER THAN GUESSED: booting
  # media-service failed on `connect ECONNREFUSED 127.0.0.1:3900` because `StorageService.onModuleInit`
  # calls `bucketExists`, which is a network round trip. Mocking it away would have made the adapter
  # under test a mock, which is the one thing a boot test may never do.
  #
  # EVERY DATABASE HERE IS DISPOSABLE, and that is load-bearing: all four services set
  # `synchronize: process.env.NODE_ENV !== 'production'`, so a boot CREATES and ALTERS the schema.
  boot-nest-apps:
    name: Boot the real AppModule (${{ matrix.service }})
    needs: [changes]
    if: ${{ needs.changes.outputs.ts-matrix != '[]' }}
    runs-on: ubuntu-latest
    # A HANG MUST BECOME A RED JOB, NOT A BURNT RUNNER. The first run of this job proved the point:
    # chat-delivery-service BOOTED - `Tests: 1 passed` - and then printed `Jest did not exit one
    # second after the test run has completed`, because its Redis client had no lifecycle hook and
    # `app.close()` left the socket open. The test's own 120 s timeout cannot see that: the test had
    # already passed. Without this ceiling the job sat in_progress for over an hour and would have
    # held the default six. The leak itself is fixed; this is what makes the NEXT one cheap.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.ts-matrix) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canari
          POSTGRES_PASSWORD: boot-probe
          POSTGRES_DB: boot_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canari"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # 8, BECAUSE PRODUCTION RUNS 8.8.0 - measured on the box, not read off a tag. This was `7`
        # while `infrastructure/docker-compose.prod.yml` said `redis:alpine`, so the gate proving a
        # service can talk to Redis was proving it against a DIFFERENT MAJOR from the one it will
        # meet. It mattered the day `ioredis` went to 6, whose breaking change is RESP3 by default:
        # a handshake exercised here against 7 says nothing certain about 8, and the reverse.
        # The floating `redis:alpine` on the production side is the other half of this and is NOT
        # fixed here - see docs/wiki/backlog.md, it restarts a Redis holding conversation history.
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # jest runs under node here for the same reason it does in the matrix above - see the note on
      # `node --run test` there.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # MinIO speaks the S3 API that `StorageService` uses, and stands in for Garage. It is started
      # with `docker run` rather than declared as a service container because the image needs a
      # command (`server /data`) and `services:` cannot set one.
      - name: Start an S3 endpoint for media-service
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=boot-probe \
            -e MINIO_ROOT_PASSWORD=boot-probe-secret \
            minio/minio:latest server /data
          # Wait on the endpoint ANSWERING, not on a clock. MinIO's liveness route needs no
          # credentials, and a 403 would still prove the server is up - so any HTTP reply ends it.
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:9000/minio/health/live"; then
              echo "S3 endpoint up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "S3 endpoint never answered"; docker logs minio; exit 1

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        run: bun install --frozen-lockfile

      # Every service gets every variable. Naming them per service would be a second place to keep
      # in sync with `app.module.ts`, and an unused variable costs nothing; a missing one costs a red
      # job that says `is required` about a service somebody else changed.
      - name: Boot it
        working-directory: ${{ matrix.service }}
        env:
          NODE_ENV: test
          # Required whenever NODE_ENV is not `production`: `auth.controller.ts` refuses to
          # start rather than guess whether the refresh cookie should carry `Secure`. `false`
          # is the value a deployed estate uses, so this boot exercises the same branch.
          ALLOW_INSECURE_COOKIES: 'false'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USERNAME: canari
          DB_PASSWORD: boot-probe
          DB_DATABASE: boot_probe
          POSTGRES_URL: postgres://canari:boot-probe@localhost:5432/boot_probe
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          GARAGE_ENDPOINT: localhost
          GARAGE_PORT: '9000'
          GARAGE_USE_SSL: 'false'
          GARAGE_REGION: us-east-1
          GARAGE_BUCKET: boot-probe
          GARAGE_ACCESS_KEY_ID: boot-probe
          GARAGE_SECRET_ACCESS_KEY: boot-probe-secret
          JWT_SECRET: boot-probe-jwt-secret
          INTERNAL_SECRET: boot-probe-internal-secret
          INTERNAL_SHARED_SECRET: boot-probe-internal-shared-secret
        run: node --run test:boot

  # =================================================================================================
  # TYPESCRIPT BACKEND MATRIX
  # =================================================================================================
  test-typescript-backend:
    name: Test TS Backend (${{ matrix.service }})
    needs: [changes]
    if: ${{ needs.changes.outputs.ts-matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.ts-matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      # Node is still installed, for ONE step: jest. Measured 2026-08-27 - under the bun runtime
      # `admin-storage.controller.mls.spec.ts` fails while passing 8/8 under node, so the test step
      # below deliberately stays on node. bun installs, lints and builds; node runs the suite. Do
      # not "simplify" this to one runtime without re-running that spec.
      - name: Setup Node.js (jest only - see the note above)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        run: bun install --frozen-lockfile

      - name: Check Lint Script
        id: check_lint
        working-directory: ${{ matrix.service }}
        run: |
          if node -e 'if(!require("./package.json").scripts || !require("./package.json").scripts.lint) process.exit(1)'; then
            echo "has_lint=true" >> $GITHUB_OUTPUT
          else
            echo "has_lint=false" >> $GITHUB_OUTPUT
          fi
          if node -e 'if(!require("./package.json").scripts || !require("./package.json").scripts["format:check"]) process.exit(1)'; then
            echo "has_format=true" >> $GITHUB_OUTPUT
          else
            echo "has_format=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Lint
        if: steps.check_lint.outputs.has_lint == 'true'
        working-directory: ${{ matrix.service }}
        run: bun run lint

      # ADDED 2026-09-02, WHEN `.husky/pre-push` WAS DELETED. Formatting was gated for the frontend
      # by the `test-frontend` job and, for `chat-delivery-service` alone, by that hook - so the four
      # services' formatting was checked NOWHERE ELSE, and three of them were never checked at all.
      # All four declare `format:check` (oxfmt; nothing in this repo is prettier), so this is a gate
      # that already had a script and no caller. Guarded like the lint step above, because the
      # failure mode of a hardcoded step is a service added next month without the script.
      - name: Check Formatting
        if: steps.check_lint.outputs.has_format == 'true'
        working-directory: ${{ matrix.service }}
        run: bun run format:check

      - name: Build
        working-directory: ${{ matrix.service }}
        run: bun run build

      - name: Check Test Script
        id: check_test
        working-directory: ${{ matrix.service }}
        run: |
          if node -e 'if(!require("./package.json").scripts || !require("./package.json").scripts.test) process.exit(1)'; then
            echo "has_test=true" >> $GITHUB_OUTPUT
          else
            echo "has_test=false" >> $GITHUB_OUTPUT
          fi

      # `node --run test`, and neither `npm test` nor `bun run test`. Two separate constraints meet
      # on this line and it is worth naming both, because collapsing either one breaks something
      # measured:
      #
      # NOT bun, because these suites are jest and jest under the bun runtime fails a spec that
      # passes under node (`admin-storage.controller.mls.spec.ts`, 8/8 under node). That is the
      # reason `Setup Node.js` above exists at all - see the note there.
      #
      # NOT npm, because this repository has no npm anywhere else and a package manager is not
      # needed to run a script. `node --run` (node >= 22) reads `package.json` scripts natively, so
      # the runtime jest needs stays and the package manager goes. It is also stricter than npm on
      # purpose: it does not run pre/post scripts and does not walk up parent directories, so what
      # runs here is exactly the `test` script of THIS service and nothing else.
      #
      # The jest -> `bun test` migration that would delete the node runtime from this file entirely
      # is a dated item in `docs/wiki/backlog.md`, scheduled after the campaign. Do not attempt it
      # by editing this line.
      - name: Run Test
        if: steps.check_test.outputs.has_test == 'true'
        working-directory: ${{ matrix.service }}
        run: node --run test

  # =================================================================================================
  # FRONTEND (SVELTE)
  # =================================================================================================
  test-frontend:
    name: Test Frontend (Svelte)
    needs: [changes]
    if: ${{ needs.changes.outputs.run-frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Rust (oxvelte >= 1.93)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache oxvelte build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/oxvelte
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          # The pinned REVISION, not the version number: 0.2.0 has meant several different
          # binaries. It must move with OXVELTE_REV in scripts/install-oxvelte.sh, or this cache
          # restores the previous one and the install script rebuilds it on every run.
          key: oxvelte-7196779a-${{ runner.os }}

      - name: Install oxvelte
        run: sh ./scripts/install-oxvelte.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: frontend
        run: bun run sync

      # The check and the tests import the generated MLS bindings and the generated protobuf
      # module. Neither is committed - they are build artefacts - so the job builds them.
      - name: Build MLS WASM
        uses: ./.github/actions/build-mls-wasm

      - name: Generate protobuf bindings
        working-directory: frontend
        run: bun run proto:gen

      - name: Lint Frontend
        working-directory: frontend
        run: |
          bun run lint
          bun run check
          bun run format:check

      - name: Run Vitest unit tests
        working-directory: frontend
        run: bun run test

      - name: Run Vitest with coverage
        working-directory: frontend
        run: bun run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # =================================================================================================
  # CROSS-CLIENT HARNESS SELF-TESTS
  # The rig's rules about itself: the two log classifiers and the phase/device declarations. None of
  # the three touches a browser, a phone or production - they are pure assertions over source, which
  # is why they can run here at all. Until 2026-08-22 they were invoked by nothing, and the fault
  # `checks-selftest` catches had left MUT-18 skipping on every run it was ever asked for.
  # =================================================================================================
  test-harness:
    name: Test Harness (self-tests)
    needs: [changes]
    if: ${{ needs.changes.outputs.run-harness == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # BUN RUNS THE HARNESS, so the job that gates it needs bun. It set up node alone until
      # 2026-09-04 and the recipe moved to `bun` the same day, which failed with `Error 127` -
      # command not found - a message that names nothing about what was missing.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # No install step: the harness has no dependencies outside the standard library.
      - name: Run harness self-tests
        run: make test-harness

  # =================================================================================================
  # CI SCRIPT SELF-TESTS
  # =================================================================================================
  # `.github/scripts/` is the only code in this repository that MERGES things, and it does it with
  # nobody watching. Its staleness predicate decides whether a green-but-older check suite is still
  # evidence, and the half of it that matters - a truncated compare, an unreadable payload - never
  # occurs on a good day, so nothing but a test will ever exercise it.
  test-ci-scripts:
    name: Test CI Scripts (self-tests)
    needs: [changes]
    if: ${{ needs.changes.outputs.run-scripts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # THE RECIPE IS NOT BASH-ONLY AND HAS NOT BEEN SINCE THE .mjs TESTS JOINED IT - three of its
      # eleven are JavaScript (`no-nul-in-source`, `wiki-links`, and the App Store submitter's own
      # 64 assertions). The comment above still said "Bash only, no dependencies", so this job
      # installed nothing and the target died on `make: bun: No such file or directory`, Error 127 -
      # the same failure, with the same message naming nothing, that `test-harness` hit on
      # 2026-09-04 and that its own Setup Bun step was added to fix. A job's dependencies are what
      # its recipe RUNS, never what a comment beside it remembers.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Run CI script self-tests
        run: make test-ci-scripts

      # `.github/scripts/` is the only code in this repository that MERGES things, so it is linted
      # rather than merely parsed. This step was refused once, for the right reason - the linter was
      # not installed on the workstation, and a gate nobody ran is how a pipeline goes red for a
      # reason nobody changed. It was then RUN: 0.10.0, against all four repositories carrying these
      # scripts, named exactly one thing - SC1091, the sourced file it cannot resolve through
      # `$(dirname "$0")` - and the `source-path=SCRIPTDIR` directives beside each `.` answer it.
      # Clean from any working directory, and proved able to fail: an unquoted `rm $f` spliced into
      # the library came back as SC2086. `-x` is what makes it follow the source.
      #
      # THE VERSION IS PINNED AND THE RUNNER'S OWN COPY IS IGNORED. `ubuntu-latest` ships a
      # shellcheck, but which one is the image's business and it moves without this repository
      # changing - a floating linter is the same defect as an unverified one, arriving later. The
      # digest is of the archive that produced the run described above, so CI lints with the binary
      # whose verdict was actually read.
      - name: Lint the CI scripts
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSLf -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" -x \
            .github/scripts/*.sh .github/scripts/lib/*.sh .github/scripts/tests/*.sh \
            infrastructure/dev/*.sh infrastructure/deploy/*.sh \
            scripts/bump-app-version.sh

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE ONE CHECK A RULESET CAN REQUIRE
  #
  # Every job above is CONDITIONAL - `changes` decides which of them run, which is what keeps a
  # documentation pull request from compiling six Rust crates. That makes each of them useless as a
  # required check: a rule naming `Test Rust (Chat Gateway)` would be waiting for a job that a
  # frontend-only change deliberately never starts, and the pull request would sit "expected" for
  # ever. **A queue nobody drains is worse than the merge it prevented** (the user's standing
  # directive), and Dependabot's auto-merge is the queue that would jam first.
  #
  # This job always runs and reads the RESULTS instead. `success` and `skipped` both pass - a skip
  # is `changes` saying the job had nothing to do - while `failure` and `cancelled` do not. It is
  # the only name a branch ruleset should ever list.
  #
  # `always()` is what makes it run at all when something upstream failed; without it this job would
  # itself be skipped by a failed dependency, and a skipped required check is a green one.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # DOES THIS REPOSITORY HAVE A GATE THAT WOULD SEE THIS DEPENDENCY UPDATE FAIL?
  #
  # A CHECK, SO THE ANSWER IS ON THE PULL REQUEST. Until 2026-09-03 this question was asked only
  # inside the hourly Dependabot sweep - a SECOND merge mechanism beside GitHub's own auto-merge, so
  # a Dependabot pull request and a human's took different routes to `main` and only one of them was
  # visible where a human looks (user: *"le auto-merge et les CI doivent considerer toutes les PR,
  # les miennes ou dependabot"*).
  #
  # #309 IS THE CASE, AND IT ALSO CORRECTS WHAT WAS FIRST WRITTEN HERE. `postgres 15-alpine ->
  # 18-alpine` is fully GREEN and correctly refused, and it sat open for days - but the sweep DID
  # post its refusal, as a `github-actions` comment naming the exact missing test. The difference a
  # check makes is that **a comment is ADVISORY**: absent from the checks list where a reader looks
  # for blockers, unreadable by the merge machinery, and outside `ci-passed`. Measured on the
  # rebased #309: `Dependency ceiling -> FAILURE`, which now drags `CI passed` red with it.
  #
  # IT FEEDS `ci-passed`, WHICH IS WHAT MAKES IT BINDING. `ci-passed` is the one check the branch
  # ruleset requires, so an update with no gate here cannot merge - by any route, armed or not.
  #
  # ONLY DEPENDABOT'S OWN PULL REQUESTS, and the reason is the input rather than the author: the
  # decision reads the `updated-dependencies` block Dependabot writes into its commit message, which
  # is the only machine-readable description of an update this repository gets. A human's pull
  # request carries no such block, so there is nothing to decide and the job skips - `ci-passed`
  # treats `skipped` as passing, which is exactly right here.
  dependency-ceiling:
    name: Dependency ceiling
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `infrastructure/docker-compose.prod.yml` IS PART OF THE DECISION rather than a
          # convenience: the datastore arm refuses a MAJOR CROSSING only, and the major production
          # runs is read out of that file instead of assumed - which is what lets `redis
          # 8.8 -> 8.10` through while refusing `postgres 15 -> 18`.
          sparse-checkout: |
            .github/scripts
            infrastructure/docker-compose.prod.yml

      # THE TABLE IS TESTED IN THE RUN THAT USES IT, and it had no test at all until it cost an
      # outage: `postgres` was simply absent from the ceiling. `ceiling.test.sh` derives the
      # stateful images it demands coverage for FROM the compose file, so the next stateful service
      # somebody declares is covered by that declaration rather than by anyone remembering.
      - name: Verify the ceiling covers every stateful image production runs
        run: bash .github/scripts/tests/ceiling.test.sh

      - name: Does a gate here exist for every dependency this changes?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/dependency-ceiling.sh

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE SECURITY PASS, AND IT CAN NOW STOP A MERGE
  #
  # CodeQL, the TruffleHog secret scan and the vulnerability audit ran on every pull request from
  # their own workflow until 2026-09-04 - and could not block a single merge, because the branch
  # ruleset requires exactly one check, `CI passed`, and they were not part of it. A live secret in a
  # PUBLIC repository or a HIGH advisory produced a red tick beside a mergeable pull request. **A red
  # tick nothing enforces is worse than no tick, because it looks enforced.**
  #
  # `code-analysis.yml` is now a `workflow_call` library with no triggers of its own, called here and
  # nightly by `scheduled.yml` - one definition, asked at both moments. THE PERMISSIONS BELOW ARE
  # DERIVED FROM WHAT IT DECLARES, not chosen: a caller caps a called workflow, and exceeding that
  # cap is a startup failure with no log and no annotation.
  #
  # NOT BEHIND `changes`, deliberately. Every other job here is gated on the paths a pull request
  # touched, which is right for a test suite and wrong for this: a secret can be committed in a
  # documentation change, and an advisory is about the lockfile a pull request did not have to edit.
  security:
    name: Security
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/code-analysis.yml
    with:
      scope: code

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE DEPENDENCY AUDIT RUNS ON EVERY PULL REQUEST AND IS NOT IN `ci-passed`
  #
  # NOT BECAUSE IT IS UNIMPORTANT, BUT BECAUSE ITS DEPENDENCY FAILS TWO TIMES IN FIVE. Measured over
  # twelve `ci.yml` runs on 2026-09-04: sixty tree-audits, TWENTY-SIX 503s from npm's advisory
  # endpoint, and FIVE attempt budgets exhausted outright - five trees that went unaudited. The rate
  # is not even stationary; the older runs in that window scored 0, 0, 0, 0, 1, 1 and the newer ones
  # 2, 6, 3, 4, 4, 5. A required check that answers "no" on a coin toss stops being a gate and
  # becomes a tax on every merge, and the standing instruction here is the opposite of that: gates
  # are for things a test can settle.
  #
  # WHAT CARRIES THE VERDICT INSTEAD is `scheduled.yml`, which calls the same file with the default
  # `scope: all` AND `registry_outage_is_failure: true` - so a tree npm never answered for is a
  # FAILURE there rather than a tolerated warning. That is the half a pull request cannot see anyway:
  # a new advisory landing against code nobody touched.
  #
  # THIS IS A REAL LOSS AND IT IS WRITTEN DOWN AS ONE: a pull request can now merge with a known
  # HIGH advisory in a lockfile it edited, and the only thing that will say so is a nightly run. The
  # honest fix is not to re-gate this on a 43%-failure endpoint - it is a source of advisories that
  # answers. GitHub's own Dependabot alert list is that source, it is already computed for this
  # repository, and nothing here reads it yet.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  dependency-audit:
    name: Dependency audit
    # THE SAME GRANT AS ABOVE, and not the smaller one this half needs. A called workflow cannot be
    # given less than any of its jobs declares, and exceeding or under-granting is a STARTUP FAILURE
    # with no job, no log and no annotation - the trap this file's header warns about. `codeql` is
    # skipped by `scope`, but it still declares `security-events: write`.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/code-analysis.yml
    with:
      scope: dependencies

  ci-passed:
    name: CI passed
    if: always()
    needs:
      [changes, test-rust, boot-nest-apps, test-typescript-backend, test-frontend, test-harness, test-ci-scripts,
      dependency-ceiling, security]
    runs-on: ubuntu-latest
    steps:
      - name: Every job either passed or had nothing to do
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed="$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed" ]; then
            echo "::error::CI did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "✅ every CI job passed or was skipped as having nothing to do"

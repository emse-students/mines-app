# =================================================================================================
# THE ONE ENTRY POINT FOR EVERY DEPLOYMENT
#
# THE MODEL, IN THE USER'S OWN TERMS (2026-09-03). Three human gestures, and nothing else moves:
#
#   1. OPEN A PULL REQUEST.  CI checks the merged combination; a green `CI passed` squash-merges it
#      onto `main` by itself. A merge deploys NOTHING.
#   2. PUBLISH A PRE-RELEASE `vX.Y.Z-alpha.N`.  Deploys `dev.canari-emse.fr` and feeds the store
#      tester programmes - if the tests are green.
#   3. PUBLISH A STABLE `vX.Y.Z`.  Deploys `canari-emse.fr` and both store production channels - if
#      the tests are green, AND only from a commit the dev estate has already served.
#
# THIS FILE IS PACKAGE 2 OF 2, AND IT CARRIES BOTH OF THOSE TWO PATHS. `ci.yml` is the
# other. The two publications are ONE machine differing by one boolean, so they are one file with
# two named paths rather than two files: a second entry point would either duplicate the chain -
# the exact "a decision taken more than once" defect this rebuild removed - or add a third level of
# reusable-workflow permission plumbing, which is what killed the first run of this chain. The
# paths are told apart by the EVENT TYPE, not by a branch and not by a guess:
#
#   prereleased -> dev.canari-emse.fr + Play `internal` + TestFlight
#   released    -> canari-emse.fr     + Play `production` + App Store REVIEW
#
# and everything before that fork - the five gates and the version bump - is shared, because it
# must be identical for both.
#
# WHY THIS FILE EXISTS AT ALL. Until 2026-09-03 those two publications drove FOUR workflows chained
# by `workflow_run`: the bump, then a deploy and two store builds each listening for its completion.
# Three consequences, all measured on the day the chain first ran for real:
#
#   * NOTHING WAS GATED ON THE TESTS. The chain required the BUMP to succeed, which is a different
#     statement. `v0.15.0` shipped with a RED CI run on the commit it released.
#   * PRODUCTION WENT AHEAD OF DEV. The stable was published from `main`'s tip, three merged pull
#     requests past the commit dev had been given, and the two releases had no relationship to each
#     other at all - two gestures on two independent commits, with nothing comparing them.
#   * EACH CHAIN RESOLVED `main` FOR ITSELF, so a merge landing mid-release could hand a store a
#     different tree from production, and nothing anywhere would have said so.
#
# All three are the same defect: a decision taken more than once, and a precondition asserted
# nowhere. So the release is now ONE RUN. It decides once, in `preflight`, and every arm below is a
# called workflow that deploys the commit it is given, to the estate it is told.
#
# THE REFUSAL COSTS NOTHING TO BUILD, because the fail-safe already existed: every arm needs the
# bump, so refusing before the bump refuses the whole chain. That property was discovered by
# accident when the bump's push was rejected and everything downstream quietly declined to run.
# =================================================================================================
name: Release

# TWO EVENT TYPES, AND GITHUB ITSELF IS THE DISCRIMINATOR. `prereleased` fires only for a release
# flagged as a pre-release; `released` fires only for one that is not (and for a pre-release later
# promoted to a release). `published` fires for BOTH, which is why it used to be the trigger - and
# why the kind then had to be inferred from the version string alone.
#
# WHAT THAT BUYS, AND IT CLOSES A DOCUMENTED TRAP. The version string and the pre-release checkbox
# are two independent statements a human makes on the same form, and until now only the version was
# read: ticking the box on a `v0.17.0`, or forgetting it on a `v0.17.0-alpha.1`, was invisible and
# the release simply went to whichever estate the hyphen implied. The guide carried a section
# warning about it. Now the two statements arrive separately - the EVENT says one, `release_kind()`
# says the other - so a mismatch is a refusal that names both, and the trap cannot be walked into.
on:
  release:
    types: [prereleased, released]
  # The hand-dispatched path, kept for one reason: a release whose chain has to be re-run after an
  # infrastructure fault, without deleting and re-publishing the release. It goes through the SAME
  # preflight - a dispatch is not a bypass.
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without the v (0.16.0, or 0.16.0-alpha.1 for a tester build)'
        required: true

# TWO RELEASES MUST NOT OVERLAP. The three deploy libraries share one `cd-deploy` group, because
# all three reach the same machine; this group serialises the whole gesture, so an alpha and a
# stable published minutes apart cannot interleave their bumps and push two versions over each
# other.
# `cancel-in-progress: false` for the same reason it is false down there: a killed release leaves a
# tree bumped and unpushed, or an estate half recreated.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # MAY THIS RELEASE START?
  #
  # Five questions, all of them in `.github/scripts/release-preflight.sh` so they can be tested on
  # inputs the API will not produce on demand, and replayed against a release that already happened.
  # The one that matters most is the fourth: a stable may only be published from a commit the dev
  # estate has already served, which is what makes production being ahead of dev IMPOSSIBLE rather
  # than merely reported.
  preflight:
    name: May this release start?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v7

      # BUN, NEVER NODE (user, 2026-09-04: "Jamais node, toujours bun"), and pinned by the ONE
      # file that names a bun version. `submit.mjs` is the single implementation of the notes
      # rule, called by this gate and by the Play arm - it was reached here through `node` while
      # CLAUDE.md documented the very same command as `bun`, so the shipped runtime and the
      # documented one had quietly diverged on the release path.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      # WHAT IS BEING RELEASED, AND FROM WHICH COMMIT - the only two facts the gates need.
      #
      # `github.event.release.target_commitish` is NOT the answer: it carries a branch NAME (`main`)
      # rather than the commit the tag was placed on, and the two differ the moment anything merges.
      # The tag is resolved to its commit instead, which is exactly the thing every gate below is
      # about.
      - name: What is being released, and from where
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck source-path=SCRIPTDIR
          # shellcheck source=/dev/null
          source .github/scripts/lib/release-preconditions.sh

          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            RAW='${{ inputs.version }}'
            REF='main'
            # A dispatch carries no checkbox, so there is nothing to cross-check against and the
            # version is the only statement made. That is the pre-2026-09-03 behaviour, kept for
            # this path alone.
            EVENT_SAYS=''
            AGREEMENT='not asked of a dispatch - it carries no checkbox, so the version is the only statement made'
          else
            RAW='${{ github.event.release.tag_name }}'
            REF="$RAW"
            # `prereleased` or `released` - the checkbox, as GitHub read it.
            EVENT_SAYS='${{ github.event.action }}'
          fi
          VERSION="${RAW#v}"

          # ONE IMPLEMENTATION OF "WHAT KIND OF RELEASE IS THIS", shared with the preflight script
          # and with `bump-app-version.sh`'s store band. The hyphen IS the definition.
          KIND_VERDICT="$(release_kind "$VERSION")"
          case "${KIND_VERDICT%% *}" in
            stable)     PRERELEASE=false ;;
            prerelease) PRERELEASE=true ;;
            *)
              echo "::error::${KIND_VERDICT#invalid }"
              exit 1 ;;
          esac

          # THE TWO STATEMENTS MUST AGREE, and this is the only place both are visible.
          #
          # The version string and the pre-release checkbox are independent things a human types on
          # one form, and the estate, the Play track and the App Store channel all follow from the
          # answer. Reading only the version meant a ticked box on a stable version silently
          # deployed PRODUCTION, and an unticked box on an alpha silently pushed a tester build to
          # the production channels - neither visible in a green run, and the guide could only
          # warn about it in prose.
          #
          # The refusal names BOTH sides on purpose: whichever one is wrong, the reader has to know
          # which to change, and "prerelease=true but 0.17.0 has no suffix" says it in one line.
          case "$EVENT_SAYS" in
            '')
              ;;
            prereleased)
              if [ "$PRERELEASE" != 'true' ]; then
                echo "::error::This release is flagged PRE-RELEASE but its version is $VERSION, which has no pre-release suffix. The two must agree: either untick 'Set as a pre-release', or name it ${VERSION}-alpha.1."
                exit 1
              fi
              AGREEMENT="the checkbox says PRE-RELEASE and $VERSION carries a suffix - they agree"
              ;;
            released)
              if [ "$PRERELEASE" != 'false' ]; then
                echo "::error::This release is NOT flagged as a pre-release but its version is $VERSION, whose suffix makes it one. The two must agree: either tick 'Set as a pre-release', or name it ${VERSION%%-*}."
                exit 1
              fi
              AGREEMENT="the checkbox is unticked and $VERSION carries no suffix - they agree"
              ;;
            *)
              echo "::error::Unknown release action '$EVENT_SAYS'. This workflow understands 'prereleased' and 'released' only, and must not guess which estate to deploy."
              exit 1
              ;;
          esac

          TARGET_SHA="$(gh api "repos/${{ github.repository }}/commits/$REF" --jq '.sha')"

          {
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "target_sha=$TARGET_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (prerelease=$PRERELEASE) from ${TARGET_SHA:0:8}"
          echo "  ok      $AGREEMENT"

      - name: Run the gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.resolve.outputs.version }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
        run: |
          set -euo pipefail

          # THE GATES READ THE RELEASED TREE, and this is what makes that literally true rather
          # than true by coincidence. The checkout above lands on the event's SHA, which for a
          # published release IS the tag's commit and for a dispatch is `main` at dispatch time -
          # close enough to be right almost always, and the fifth gate reads a FILE out of the
          # working tree, so "almost always" is not good enough: a dispatch minutes after a merge
          # would judge the release notes of a commit it is not releasing.
          git fetch --depth 1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD

          bash .github/scripts/release-preflight.sh

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # WRITE THE VERSION EVERYWHERE, IN ONE COMMIT
  #
  # 18 files: 17 manifests and `CHANGELOG.md`. `.github/scripts/tests/bump-staging.test.sh` asserts
  # that the commit carries everything the script wrote, because a release whose components disagree
  # surfaces at a store upload rather than in CI.
  bump:
    name: Write the version across the project
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      # THE COMMIT EVERY ARM BELOW BUILDS. Resolved here, once, and passed down - never re-derived
      # from `main`, which moves: the bump's own push raises a `push` event, so CI runs on `main`
      # while this workflow is still going, and a pull request merged in those minutes would land
      # inside the run. Three chains each resolving `main` for themselves is how a store bundle gets
      # built from a different tree than production, with no artefact carrying the commit to say so.
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # MINTED BEFORE THE CHECKOUT, because the checkout has to store THIS credential as the
      # remote's - a later `git push` uses whatever token the checkout persisted, not the one in
      # scope.
      #
      # AN APP AND NOT `GITHUB_TOKEN`. The push below is the one push to `main` that is not a pull
      # request, and the branch ruleset refuses `github-actions[bot]`; the Actions app cannot be
      # exempted from a repository ruleset at all (`422 Actor GitHub Actions integration must be
      # part of the ruleset source or owner organization`). `canari-auto-merge` is an organisation
      # installation, which GitHub does accept. The token is minted per run and expires in an hour,
      # so there is no long-lived secret to rotate before it silently expires.
      #
      # `client-id` and NOT `app-id`: v3 deprecated the numeric id. They are different VALUES, not
      # two names for one.
      - name: Mint the identity the ruleset lets push to main
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      # The commit the preflight approved, not `main` - so what is bumped is what was checked.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump every manifest, both store build numbers, and the changelog
        run: bash scripts/bump-app-version.sh "${{ needs.preflight.outputs.version }}"

      - name: Commit and push to main
        id: push
        run: |
          set -euo pipefail
          # The App is what the ruleset lets through, so the commit says so rather than claiming to
          # be `github-actions[bot]`, the identity that is REFUSED here.
          git config user.name "canari-auto-merge[bot]"
          git config user.email "canari-auto-merge[bot]@users.noreply.github.com"

          # `-u` STAGES WHAT THE SCRIPT ACTUALLY CHANGED, and it replaced an eleven-line enumeration
          # of paths - a second, silent statement of which files carry a version, with nothing
          # comparing it against the script. `-u` asks git instead of a human.
          #
          # `-u` AND NOT `-A`, deliberately: tracked modifications only, so an untracked artefact
          # cannot ride along. `frontend/mls-core/Cargo.lock` is the live example - the script
          # rewrites it, `.gitignore`'s `*.lock` means git does not track it, and it must stay out.
          git add -u

          if git diff --cached --quiet; then
            echo "No version changes (already at ${{ needs.preflight.outputs.version }})"
          else
            echo "Staged for the bump to ${{ needs.preflight.outputs.version }}:"
            git diff --cached --name-only | sed 's/^/  /'
            git commit -m "chore: bump version to ${{ needs.preflight.outputs.version }}"
            git push origin HEAD:main
          fi

          # EITHER WAY, the commit the arms below must build is this tree's HEAD. A no-op bump is an
          # ordinary event - a re-published release, or a bump landed through a pull request first -
          # and its HEAD is already the right commit.
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Every arm of this release builds ${SHA:0:8}"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE THREE ARMS
  #
  # Called workflows, not `workflow_run` listeners, so they are JOBS OF THIS RUN: one page to read,
  # real `needs:` ordering, and the same three inputs to all three - which is what stops them
  # disagreeing about what is being released. Each decides only what is local to it (a Play track, a
  # compose project); none of them decides what the release IS.
  #
  # `secrets: inherit` because each holds its own credentials - signing keys, store API keys, the
  # deploy host. Naming them one by one here would be a fourth list to keep in step with three files.
  # A CALLED WORKFLOW CANNOT BE GRANTED MORE THAN ITS CALLER GRANTS IT, and exceeding that is a
  # STARTUP FAILURE - no job runs, no log is produced, and the API returns neither an annotation nor
  # an error message. `v0.16.0-alpha.1` was published and the run died that way, on the first real
  # use of this chain.
  #
  # This file's top-level `permissions: contents: read` is the whole cause. It is correct for
  # `preflight` and for `bump` (which pushes with an App token, not with `GITHUB_TOKEN`), and it
  # silently capped all three arms - each of which asks for `contents: write` to attach an artefact
  # to the release, and `build.yml` for `packages: write` to push images to GHCR. **The permissions
  # below are therefore derived from what each callee declares, not chosen here**, and
  # `release-chain.test.sh` reads both sides and fails if a callee ever asks for a scope its caller
  # does not grant.
  #
  # THE DEFECT IS CREATED BY THE COLLAPSE ITSELF. As four independently triggered workflows there
  # was no caller to cap anything, so every one of them simply got what it declared. Turning them
  # into called workflows introduced a ceiling that had never existed, and nothing in the tree said
  # so.
  # THE FORK IS HERE, AND IT HAPPENS ONCE (user, 2026-09-07: *"faire la dichotomie plus tot dans
  # l'arborescence"*).
  #
  # WHAT IT REPLACED. `deploy.yml` was ONE file holding the build jobs AND both estates, called
  # TWICE with `phase: build | production`. Every job of a called workflow becomes a row in the run
  # graph even when its `if:` cannot hold on that call, so each call drew the other call's jobs as
  # skipped rows. Measured on `v0.16.4` (run 34057019347), the last stable to reach the end: 22
  # rows, 5 skipped, and 4 of those 5 STRUCTURALLY IMPOSSIBLE rather than merely not taken this
  # time. A parameter that selects half a file produces the other half as dead rows, on every call.
  #
  # AND THE RELEASE KIND WAS ASKED EIGHT TIMES. `preflight` resolves it once and it was then carried
  # DOWN as `prerelease` and re-tested in every callee, each re-deriving the same fork for itself.
  # It becomes a NAME here - `dev` or `production` - and below this point nothing asks again:
  # `serve-dev.yml` and `serve-prod.yml` contain no mention of a pre-release at all, and `build.yml`
  # is simply told which estate it is building for.
  #
  #   build       - the frontend and the images. ALWAYS, and the same work either way but for the
  #                 estate it is told to build for. Starts beside the two mobile arms.
  #   serve-dev   - the dev estate. Pre-releases only, and only where that estate is enabled.
  #   serve-prod  - the production estate. Stables only, and only once BOTH stores took the version.
  #
  # THE TWO ESTATES STAY SEPARATE CALLS FOR THE REASON THE OLD SPLIT EXISTED: a called workflow
  # cannot depend on a job of its caller, so `[android, ios]` is only expressible out here. What
  # changed is that a call now names the estate it serves, instead of a phase that selects half of
  # a file.
  #
  # AND THE PERMISSIONS ARE EXACT NOW, which the single call made impossible: `deploy` had to grant
  # the UNION of what both halves needed - `contents: write` AND `packages: write` - so the build
  # jobs ran with a token that could move release markers and the estate jobs with one that could
  # push images. Each call below grants what its own callee declares and nothing more.
  build:
    name: Build
    needs: [preflight, bump]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ needs.bump.outputs.sha }}
      version: ${{ needs.preflight.outputs.version }}
      # THE ONE PLACE THE RELEASE KIND BECOMES AN ESTATE NAME. Everything downstream reads the name.
      estate: ${{ needs.preflight.outputs.prerelease == 'true' && 'dev' || 'production' }}
    secrets: inherit

  # `vars.DEV_ENVIRONMENT_ENABLED` IS READ HERE AND NOWHERE ELSE. It used to be one clause of a
  # six-line boolean inside the callee, where a disabled estate left nothing but a skipped job among
  # four other skipped jobs. A repository variable and not a secret, deliberately: whether a second
  # estate is being deployed is not a secret, and a silent gate is one nobody can debug.
  serve-dev:
    name: Dev estate
    needs: [preflight, bump, build]
    if: needs.preflight.outputs.prerelease == 'true' && vars.DEV_ENVIRONMENT_ENABLED == 'true'
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/serve-dev.yml
    with:
      sha: ${{ needs.bump.outputs.sha }}
      version: ${{ needs.preflight.outputs.version }}
      services_args: ${{ needs.build.outputs.services_args }}
      images_result: ${{ needs.build.outputs.images_result }}
    secrets: inherit

  android:
    name: Google Play
    needs: [preflight, bump]
    # `contents: write` to attach the signed `.aab` to the published release.
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      sha: ${{ needs.bump.outputs.sha }}
      version: ${{ needs.preflight.outputs.version }}
      prerelease: ${{ needs.preflight.outputs.prerelease }}
    secrets: inherit

  ios:
    name: App Store
    needs: [preflight, bump]
    # `contents: write` to attach the signed `.ipa` to the published release.
    permissions:
      contents: write
    uses: ./.github/workflows/ios.yml
    with:
      sha: ${{ needs.bump.outputs.sha }}
      version: ${{ needs.preflight.outputs.version }}
      prerelease: ${{ needs.preflight.outputs.prerelease }}
    secrets: inherit

  # THE WEB GOES LAST, AND ONLY IF BOTH STORES TOOK THE SAME VERSION.
  #
  # `needs: [build, android, ios]` IS A SUCCESS DEPENDENCY, deliberately: there is no `always()`
  # here and there must not be one. A failed or cancelled mobile arm leaves this job `skipped`,
  # production keeps serving the previous release, and the recovery is "Re-run failed jobs" on the
  # run that already exists. What must NOT be done is adding `always()` and a result test, which is
  # how a gate becomes a formality.
  #
  # AND SINCE 2026-09-07 IT REFUSES ONLY WHAT A STORE ACTUALLY REFUSED. Apple gives an app ONE
  # non-terminal version slot, so releasing faster than Apple reviews finds it busy - the expected
  # outcome, and not a failure of anything. `submit.mjs` used to leave through `exit 1` for that
  # exactly as it does for a real refusal, so a BUSY QUEUE skipped this deploy three times running
  # (v0.16.2, v0.16.3, v0.16.4) and production sat on v0.16.1 for three days while two releases
  # reported themselves shipped. The two outcomes are separate exit codes now, and `ios.yml` is
  # green on a deferral. The dependency below finally means what it always claimed to.
  #
  # `if:` RATHER THAN A SKIP INSIDE THE CALLEE, because a pre-release has no production estate at
  # all: without this condition every alpha would spend a job starting a workflow whose only job
  # then refuses itself, and a run full of hollow greens is a run nobody reads.
  serve-prod:
    name: Production estate
    needs: [preflight, bump, build, android, ios]
    if: needs.preflight.outputs.prerelease == 'false'
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/serve-prod.yml
    with:
      sha: ${{ needs.bump.outputs.sha }}
      version: ${{ needs.preflight.outputs.version }}
      services_args: ${{ needs.build.outputs.services_args }}
    secrets: inherit

  # =================================================================================================
  # THE SAME NOTES ON THE GITHUB RELEASE (user, 2026-09-03: the changelog can be the same on every
  # platform, and in the GitHub console at the version bump)
  # =================================================================================================
  # `store/whats-new.txt` fed the App Store and, since today, Google Play. The GitHub release
  # carried whatever a human typed into the box, or nothing - a third text for the same event.
  #
  # PARALLEL WITH THE THREE ARMS, `needs: [preflight, bump]` AND NOTHING DEPENDING ON IT. That is
  # not tidiness, it is the lesson of `v0.16.0`: a GitHub release update was refused
  # (`Resource not accessible by integration`) and the two steps that actually SHIPPED were
  # `skipped` behind it, so production and Play got the release and Apple got nothing. **A release
  # body is a convenience; the stores are the deliverable.** Placed here, a refusal fails this run
  # loudly and can skip nothing - and it would be a SECOND instance of that unexplained 403, on a
  # different endpoint, which is evidence the open P1 does not have yet.
  #
  # THE APP TOKEN AND NOT `GITHUB_TOKEN`, for the same reason the bump uses it: it is the identity
  # this repository already trusts to write, and `GITHUB_TOKEN` is the one that was refused.
  notes:
    name: Release notes
    needs: [preflight, bump]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint the identity that may write a release
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      # The commit the bump produced, so the notes read are the ones that shipped.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      # BUN, NEVER NODE (user, 2026-09-04: "Jamais node, toujours bun"), and pinned by the ONE
      # file that names a bun version. `submit.mjs` is the single implementation of the notes
      # rule, called by this gate and by the Play arm - it was reached here through `node` while
      # CLAUDE.md documented the very same command as `bun`, so the shipped runtime and the
      # documented one had quietly diverged on the release path.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Put the release notes in the release body
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          MARKETING_VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail

          # A PRE-RELEASE HAS NO NOTES TO CARRY, and that is a property of the file rather than a
          # policy here: it opens with `version: X.Y.Z` naming the STABLE, so asking for an alpha's
          # notes is asking for a text nobody wrote. The stable that follows is what documents them.
          if [ "$PRERELEASE" = "true" ]; then
            echo "$MARKETING_VERSION is a pre-release; the notes belong to its stable."
            exit 0
          fi

          # ONE IMPLEMENTATION OF THE NOTES RULE, the same call the fifth preflight gate makes and
          # the same one the Play arm makes. Nothing here re-parses the file.
          notes="$(bun tools/app-store/submit.mjs --print-notes)"

          # THE BODY IS READ LIVE, and not from `github.event.release.body`: on a re-run that
          # payload is the ORIGINAL event's, so writing from it would resurrect a body somebody has
          # since edited.
          gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.body // ""' > body-current.md
          printf '%s' "$notes" > notes.md

          # THE COMPOSITION IS A TESTED SCRIPT, not inline shell, because it is a pure function of
          # those two files and its interesting inputs are ones a live release never produces - a
          # body carrying a STALE block, a body with the markers and nothing between them.
          # `.github/scripts/tests/release-notes-body.test.sh` produces them; 11 assertions, and
          # the one that matters is idempotence.
          bash .github/scripts/release-notes-body.sh body-current.md notes.md > body-next.md

          if cmp -s body-current.md body-next.md; then
            echo "the release body already carries the notes for $MARKETING_VERSION."
            exit 0
          fi

          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F body=@body-next.md --jq '.html_url'
          printf 'release body updated - %s characters of notes for %s\n' "${#notes}" "$MARKETING_VERSION"

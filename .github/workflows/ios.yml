name: Ship to the App Store

# Mirrors android-release.yml: runs after "Bump version on release" syncs
# frontend/package.json on main, and attaches the signed .ipa to the GitHub Release.
# Public repo => GitHub-hosted macOS runners are free.
# CALLED BY `release.yml`, AND BY NOTHING ELSE. It used to listen for the bump run's completion
# itself, which is what made three workflows each re-derive the same facts and each resolve `main`
# for itself - so a merge landing mid-release could give a store a different tree from production,
# with nothing anywhere to say so. The orchestrator resolves the commit once and hands it down.
#
# AND IT IS ALSO HAND-DISPATCHABLE AS A PURE COMPILE CHECK, which is a capability rather than a
# second door. This is the ONLY way to compile Swift, ObjC or Kotlin from the Windows workstation
# this project is developed on: none of a Swift `guard` body that falls through, a Kotlin nested
# type in a companion object, or a plugin command missing from its ACL is visible to
# `cargo clippy`, `bun run check` or any gate that runs locally. Collapsing the release chain into
# one run removed the trigger for a commit, which would have taken that capability away silently.
#
# WHAT MAKES IT SAFE IS `publish`, CARRIED AS DATA. The old version reasoned about
# `github.event_name` to tell a compile check from a release - and in a called workflow
# `github.event_name` is the CALLER's event, so that reasoning is not merely wrong here, it is
# unanswerable. A dispatch therefore declares `publish: false` and every step that reaches a store
# or a release reads that input instead of guessing from an event.
on:
  workflow_call:
    inputs:
      sha:
        description: 'The exact commit to build - resolved ONCE by the caller'
        required: true
        type: string
      version:
        description: 'The version the bump wrote into the manifests'
        required: true
        type: string
      prerelease:
        description: 'The string "true" or "false", already read off the version by the caller'
        required: true
        type: string

      publish:
        description: 'Whether this run may reach a store or a release. A release always may.'
        required: false
        default: true
        type: boolean

  # A COMPILE CHECK, and it ships nothing: `publish` defaults to false here and every publishing
  # step is gated on it. `sha` may be left empty, in which case the branch this is dispatched from
  # is what gets built - which is the whole point when the question is "does this native change
  # compile at all".
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to build. Empty builds the branch this is dispatched from.'
        required: false
        default: ''
        type: string
      version:
        description: 'Version to stamp. Only affects the artefact name on a compile check.'
        required: false
        default: '0.0.0-compilecheck'
        type: string
      prerelease:
        description: 'The string "true" or "false". A compile check should stay "true".'
        required: false
        default: 'true'
        type: string
      publish:
        description: 'Leave OFF. Turning it on makes a hand-dispatched run reach a real store.'
        required: false
        default: false
        type: boolean

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15 # Xcode 16.2+ (required for current iOS SDK / Tauri toolchain)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # An empty `sha` is the compile-check case: build the ref this was dispatched from.
          ref: ${{ inputs.sha != '' && inputs.sha || github.ref }}

      # THE CALLER HAS ALREADY DECIDED. This step used to read `frontend/package.json` back off the
      # checkout, for a reason that was correct at the time: a `workflow_run` carries neither
      # `release.prerelease` nor a usable branch. `release.yml` now reads the manifest the bump just
      # WROTE and hands the same answer to all three chains, so the App Store channel, the Play
      # track and the estate cannot disagree.
      - name: Read the release under way
        id: release_tag
        run: |
          set -euo pipefail
          {
            echo "version=${{ inputs.version }}"
            echo "prerelease=${{ inputs.prerelease }}"
          } >> "$GITHUB_OUTPUT"
          echo "Building Canari v${{ inputs.version }} (prerelease=${{ inputs.prerelease }})"

      - name: Select Xcode (>= 16.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '>=16.2.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            frontend/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx svelte-kit sync

      - name: Build MLS WASM
        uses: ./.github/actions/build-mls-wasm

      - name: Generate protobuf bindings
        working-directory: frontend
        run: bun run proto:gen

      - name: Validate iOS release secrets
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_PROVISIONING_PROFILE_NSE: ${{ secrets.APPLE_PROVISIONING_PROFILE_NSE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
        run: |
          # Two provisioning profiles are required because the project signs two bundles
          # manually: the app (fr.emse.canari, profile "Canari") and the Notification
          # Service Extension (fr.emse.canari.notifications, profile "CanariNotifications").
          required=(
            APPLE_SIGNING_IDENTITY
            APPLE_CERTIFICATE_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_PROVISIONING_PROFILE
            APPLE_PROVISIONING_PROFILE_NSE
            APPLE_TEAM_ID
            GOOGLE_SERVICE_INFO_PLIST
            JWT_SECRET
            BASE_URL
            AUTHENTIK_URL
            AUTHENTIK_CLIENT_ID
          )

          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub secret: ${key}"
              exit 1
            fi
          done

          echo "✅ Required iOS secrets are present"

      - name: Install Apple signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Créer un keychain temporaire
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Décoder et importer le certificat
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "✅ Signing certificate installed"

      - name: Install provisioning profiles
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_PROVISIONING_PROFILE_NSE: ${{ secrets.APPLE_PROVISIONING_PROFILE_NSE }}
        run: |
          # Install BOTH profiles into the runner's profile store. xcodebuild resolves the
          # PROVISIONING_PROFILE_SPECIFIER names ("Canari", "CanariNotifications") set in
          # the project by scanning these installed profiles, so both must be present.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local b64="$1"
            local label="$2"
            local tmp="$RUNNER_TEMP/${label}.mobileprovision"
            echo "$b64" | base64 --decode > "$tmp"
            local uuid
            uuid=$(security cms -D -i "$tmp" | plutil -extract UUID raw -)
            local name
            name=$(security cms -D -i "$tmp" | plutil -extract Name raw -)
            cp "$tmp" "$PROFILES_DIR/$uuid.mobileprovision"
            echo "✅ Installed profile '$name' (UUID: $uuid) for $label"
          }

          install_profile "$APPLE_PROVISIONING_PROFILE" "app"
          install_profile "$APPLE_PROVISIONING_PROFILE_NSE" "nse"

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          # Must match the pbxproj file reference path (canari_iOS/GoogleService-Info.plist,
          # lowercase to match the on-disk group folder) so Xcode bundles it and
          # [FIRApp configure] finds it at launch. printf (not echo) preserves the
          # exact XML without interpreting backslashes or appending a stray newline.
          PLIST_DIR="frontend/src-tauri/gen/apple/canari_iOS"
          mkdir -p "$PLIST_DIR"
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "$PLIST_DIR/GoogleService-Info.plist"
          echo "✅ GoogleService-Info.plist written to $PLIST_DIR"

      - name: Set export compliance code in Info.plist
        env:
          EXPORT_COMPLIANCE_CODE: ${{ secrets.APP_STORE_CONNECT_EXPORT_COMPLIANCE_CODE }}
        run: |
          # Apple rejects the TestFlight upload with "Invalid Export Compliance Code" unless this
          # code - generated once in App Store Connect's own compliance documentation for this
          # app - is present alongside ITSAppUsesNonExemptEncryption (already committed, true).
          # Kept as a secret rather than committed to Info.plist: this is a public repo, and
          # while the code itself is not a credential that grants access to anything, it is still
          # an Apple-account-specific value tied to one developer's compliance record, with no
          # reason to be permanently baked into a public file when every other Apple-account
          # value here already isn't. Skips (does not fail) when unset, matching the TestFlight
          # upload step below, which already tolerates the other App Store Connect secrets being
          # absent - Info.plist is simply left as committed, and that step's own 409 explains why.
          PLIST="src-tauri/gen/apple/canari_iOS/Info.plist"
          if [ -z "$EXPORT_COMPLIANCE_CODE" ]; then
            echo "::warning::APP_STORE_CONNECT_EXPORT_COMPLIANCE_CODE not set; Info.plist left unchanged"
          else
            /usr/libexec/PlistBuddy -c "Delete :ITSEncryptionExportComplianceCode" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ITSEncryptionExportComplianceCode string ${EXPORT_COMPLIANCE_CODE}" "$PLIST"
            echo "✅ ITSEncryptionExportComplianceCode set in Info.plist"
          fi
        working-directory: frontend

      # AN ALPHA POINTS AT dev.canari-emse.fr AND A STABLE AT PRODUCTION - the same assertion
      # android-release.yml makes, for the same reason: a store build bakes its backend origin in
      # and cannot be re-pointed afterwards, and neither wrong answer is visible in a green
      # pipeline. No fallback between the two secret sets, ever.
      - name: Create frontend .env
        working-directory: frontend
        env:
          IS_PRERELEASE: ${{ steps.release_tag.outputs.prerelease }}
          BASE_URL: ${{ secrets.BASE_URL }}
          AUTHENTIK_URL: ${{ secrets.AUTHENTIK_URL }}
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
          DEV_AUTHENTIK_URL: ${{ secrets.DEV_AUTHENTIK_URL }}
          DEV_AUTHENTIK_CLIENT_ID: ${{ secrets.DEV_AUTHENTIK_CLIENT_ID }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          set -euo pipefail

          # Same variable set as android-release.yml: the SvelteKit frontend is shared, so it needs
          # the identical build-time config (Authentik SSO included).
          if [ "$IS_PRERELEASE" = "true" ]; then
            APP_URL="$DEV_BASE_URL"
            IDP_URL="$DEV_AUTHENTIK_URL"
            IDP_CLIENT="$DEV_AUTHENTIK_CLIENT_ID"
          else
            APP_URL="$BASE_URL"
            IDP_URL="$AUTHENTIK_URL"
            IDP_CLIENT="$AUTHENTIK_CLIENT_ID"
          fi

          for name in APP_URL IDP_URL IDP_CLIENT; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty for a $([ "$IS_PRERELEASE" = "true" ] && echo pre-release || echo stable) build. The DEV_ and production secret sets are kept separate on purpose - there is no fallback between them."
              exit 1
            fi
          done

          case "$APP_URL" in
            *"dev.canari-emse.fr"*) URL_ENVIRONMENT=dev ;;
            *"canari-emse.fr"*) URL_ENVIRONMENT=production ;;
            *) URL_ENVIRONMENT=unknown ;;
          esac
          if [ "$IS_PRERELEASE" = "true" ] && [ "$URL_ENVIRONMENT" != "dev" ]; then
            echo "::error::This is a PRE-RELEASE but its backend URL resolves to '${URL_ENVIRONMENT}'. Refusing to send an alpha pointing anywhere but dev to TestFlight."
            exit 1
          fi
          if [ "$IS_PRERELEASE" != "true" ] && [ "$URL_ENVIRONMENT" != "production" ]; then
            echo "::error::This is a STABLE release but its backend URL resolves to '${URL_ENVIRONMENT}'. Refusing to ship a production build pointing anywhere else."
            exit 1
          fi
          echo "iOS build targets ${URL_ENVIRONMENT} (${APP_URL})"

          echo "VITE_FRONTEND_URL=${APP_URL}" > .env
          echo "VITE_GATEWAY_URL=${APP_URL}" >> .env
          echo "VITE_DELIVERY_URL=${APP_URL}" >> .env
          echo "VITE_MEDIA_URL=${APP_URL}" >> .env
          echo "VITE_CALL_URL=${APP_URL}" >> .env
          echo "VITE_SOCIAL_URL=${APP_URL}" >> .env
          echo "VITE_CORE_URL=${APP_URL}" >> .env
          echo "VITE_AUTHENTIK_URL=${IDP_URL}" >> .env
          echo "VITE_AUTHENTIK_CLIENT_ID=${IDP_CLIENT}" >> .env
          echo "VITE_CALL_E2E_ENCRYPTION=false" >> .env
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "VITE_DEPLOY_ENVIRONMENT=development" >> .env
          fi
          if [ -n "$KLIPY_API_KEY" ]; then
            echo "VITE_KLIPY_KEY=${KLIPY_API_KEY}" >> .env
          fi

      - name: Verify frontend env for iOS build
        working-directory: frontend
        run: |
          grep -q '^VITE_FRONTEND_URL=.' .env
          grep -q '^VITE_GATEWAY_URL=.' .env
          grep -q '^VITE_DELIVERY_URL=.' .env
          grep -q '^VITE_MEDIA_URL=.' .env
          grep -q '^VITE_CALL_URL=.' .env
          grep -q '^VITE_SOCIAL_URL=.' .env
          grep -q '^VITE_CORE_URL=.' .env
          grep -q '^VITE_AUTHENTIK_URL=.' .env
          grep -q '^VITE_AUTHENTIK_CLIENT_ID=.' .env
          echo "✅ iOS frontend env prepared"

      - name: Resolve Swift Packages
        working-directory: frontend/src-tauri/gen/apple
        run: xcodebuild -resolvePackageDependencies -project canari.xcodeproj -scheme canari_iOS

      - name: Build frontend
        working-directory: frontend
        run: |
          # Must run before "Prebuild Rust static lib": with `--features tauri/custom-protocol`
          # enabled there, `generate_context!()` embeds `frontendDist` (../build) at compile
          # time and panics if the directory doesn't exist yet - it only skips that check in
          # dev mode (tauri-codegen's context.rs: `dev && dev_url.is_some()`), which is no
          # longer what this build compiles as. TAURI_TARGET activates the Vite mlsWasmStub
          # plugin, excluding WASM modules from the Tauri build (MLS is handled by native Rust
          # code on iOS).
          TAURI_TARGET=aarch64-apple-ios bun run build

      - name: Prebuild Rust static lib (libapp.a)
        working-directory: frontend/src-tauri
        env:
          # Match the lowest pbxproj IPHONEOS_DEPLOYMENT_TARGET (14.0). Without it,
          # rustc/cc default the objects' min-iOS to the SDK version, and every link
          # pass floods "object file built for newer iOS version than being linked"
          # (~75 ld warnings per run).
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: |
          # The Xcode "Build Rust Code" phase is disabled in the hand-maintained pbxproj
          # (it shells out to bun, which isn't on Xcode's PATH), and Externals/ is
          # gitignored - so a clean checkout has no libapp.a and both the app AND the NSE
          # fail to link with `ld: library 'app' not found`. Reproduce what Tauri's
          # xcode-script does: cross-compile the app staticlib and drop it where the
          # linker search path (Externals/<arch>/<config>) expects it, as `libapp.a`.
          # rust-toolchain.toml pins 1.97.0 (no `targets`), which overrides the action's
          # `stable` here - so the iOS std isn't installed for the toolchain cargo actually
          # uses. Add it to the pinned toolchain (override is active in this dir).
          #
          # --features tauri/custom-protocol is required here because we bypass `tauri ios
          # build`: that CLI enables it automatically, but a raw `cargo build` does not, and
          # without it tauri-build's build.rs bakes `dev=true` into the binary (dev =
          # !has_feature("custom-protocol"), tauri-2.11.1/build.rs). A "dev" binary loads the
          # webview from the Vite dev server (127.0.0.1:1420) instead of the bundled
          # frontendDist assets - unreachable on a real device, producing a black screen with
          # "did you grant local network permission?" (this shipped once, TestFlight v0.14.4).
          rustup target add aarch64-apple-ios
          cargo build --lib --release --target aarch64-apple-ios --features tauri/custom-protocol
          LIB=$(find target/aarch64-apple-ios/release -maxdepth 1 -name 'libmines_app_lib.a' | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::libmines_app_lib.a not produced by cargo"
            exit 1
          fi
          DEST=gen/apple/Externals/arm64/release
          mkdir -p "$DEST"
          cp "$LIB" "$DEST/libapp.a"
          echo "✅ libapp.a staged at $DEST ($(du -h "$DEST/libapp.a" | cut -f1))"

      - name: Build iOS archive
        working-directory: frontend
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # The Vite build itself now runs earlier, in "Build frontend" - "Prebuild Rust
          # static lib" needs `../build` to already exist by the time it compiles.
          #
          # Tauri normally copies frontendDist (../build) into the Xcode assets folder
          # before archiving. Since we bypass `tauri ios build`, we must do this manually.
          # Use `build/.` (not `build/*`) so dotfiles like .well-known/ are included.
          rm -rf src-tauri/gen/apple/assets
          mkdir -p src-tauri/gen/apple/assets
          cp -r build/. src-tauri/gen/apple/assets/

          # Archive directly with xcodebuild, bypassing Tauri's export step which fails
          # with "requires a provisioning profile with the App Groups feature" because
          # Tauri's generated ExportOptions.plist cannot express a two-target
          # (app + appex) manual-signing profile map.
          ARCHIVE_DIR="src-tauri/gen/apple/build"
          ARCHIVE_NAME="canari_iOS.xcarchive"
          ARCHIVE_PATH="${ARCHIVE_DIR}/${ARCHIVE_NAME}"

          # Clean any stale archive so xcodebuild does not append.
          rm -rf "$ARCHIVE_PATH"

          xcodebuild archive \
            -project src-tauri/gen/apple/canari.xcodeproj \
            -scheme canari_iOS \
            -archivePath "$ARCHIVE_PATH" \
            -configuration release \
            -sdk iphoneos \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${APPLE_SIGNING_IDENTITY}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "::error::xcodebuild archive failed to produce ${ARCHIVE_PATH}"
            exit 1
          fi

          echo "Archive produced: ${ARCHIVE_PATH}"

      - name: Export signed IPA
        id: outputs
        working-directory: frontend/src-tauri/gen/apple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Re-export the archive produced by the previous step with an ExportOptions.plist
          # that pins manual signing and maps EACH bundle id to its named distribution
          # profile. Both profiles are already installed in the runner store (by name) and
          # carry the required entitlements (App Groups, Associated Domains, aps-environment).
          ARCHIVE="build/canari_iOS.xcarchive"
          if [ ! -d "$ARCHIVE" ]; then
            echo "::error::Archive not found at ${ARCHIVE}"
            find build -maxdepth 3 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Archive: $ARCHIVE"

          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>fr.emse.canari</key>
              <string>Canari</string>
              <key>fr.emse.canari.notifications</key>
              <string>CanariNotifications</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

          IPA=$(find build/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::exportArchive produced no .ipa"
            exit 1
          fi
          echo "ipa=frontend/src-tauri/gen/apple/$IPA" >> "$GITHUB_OUTPUT"
          echo "IPA: $IPA"

          # THE BUILD NUMBER IS READ OFF THE ARCHIVE, never recomputed. The submission step below
          # has to name the build it wants among everything in App Store Connect, and the only
          # answer that cannot be wrong is the `CFBundleVersion` of the binary this job actually
          # signed - a second implementation of the store band (`scripts/bump-app-version.sh`
          # computes it as (major*1e6 + minor*1e3 + patch)*100 + rank) would be one more place for
          # the two to disagree, and they would disagree silently: the submission would simply wait
          # for a build number nobody uploaded until it timed out.
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$ARCHIVE/Info.plist")"
          if [ -z "$BUILD_NUMBER" ]; then
            echo "::error::the archive carries no CFBundleVersion, so no submission could name its build"
            exit 1
          fi
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Build number: $BUILD_NUMBER"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: ${{ steps.outputs.outputs.ipa }}

      - name: Upload to TestFlight / App Store Connect
        id: testflight
        if: inputs.publish
        # GATED ON `inputs.publish`, WHICH IS DATA, and never on an event again. This step used to
        # read `github.event_name == 'workflow_run'`, meaning "a real release rather than a
        # hand-dispatched compile check" - and in a `workflow_call` workflow `github.event_name` is
        # the CALLER's event, so the condition became permanently FALSE when the chain collapsed
        # into one run: the build would have succeeded, the run would have been green, and NO STORE
        # WOULD HAVE RECEIVED ANYTHING.
        #
        # The distinction it was reaching for is real and still needed - a compile check must ship
        # nothing - so it is carried explicitly by the caller instead of inferred from an event
        # nobody here can see. `release.yml` passes nothing and takes the callable default, `true`;
        # a hand dispatch of THIS workflow defaults it to `false`.
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IPA_PATH: ${{ steps.outputs.outputs.ipa }}
        run: |
          # Pushes the App-Store-signed .ipa to App Store Connect (lands in TestFlight).
          # A raw .ipa cannot be sideloaded from a GitHub Release on iOS, so this is the
          # only real distribution path. The step SKIPS (does not fail) until the three
          # App Store Connect API-key secrets exist, so the build/release stays green in
          # the meantime.
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::warning::App Store Connect API key secrets not set; skipping TestFlight upload"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # altool auto-discovers the key at ~/.appstoreconnect/private_keys/AuthKey_<KEYID>.p8
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "Uploading ${IPA_PATH} to App Store Connect…"

          ALTOOL_LOG="$(mktemp)"
          set +e
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > "$ALTOOL_LOG" 2>&1
          ALTOOL_EXIT=$?
          set -e
          cat "$ALTOOL_LOG"
          rm -f "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          # A BUILD APPLE ALREADY HAS IS THIS STEP'S POSTCONDITION, NOT ITS FAILURE, and this is
          # what makes "Re-run failed jobs" work on this arm at all. The build number is derived
          # from the version, so a re-run uploads the SAME CFBundleVersion and Apple answers
          # `ERROR ITMS-4238: Redundant Binary Upload` - a statement that the binary is already
          # there, which is exactly what the step was asked to achieve.
          #
          # MEASURED ON `v0.16.1`. That run failed on the very LAST request of the submission
          # chain (a 500 from Apple on `PATCH /reviewSubmissions`) with the build uploaded, the
          # version created and the notes written - and the write had in fact LANDED, the version
          # showing as added for review. A red job over a shipped release, and the documented
          # recovery could not even be attempted: "Re-run failed jobs" would have died HERE, on a
          # redundant upload, several steps before the one that needed retrying.
          #
          # NARROW ON PURPOSE. Only Apple's own redundancy markers are read as success; every other
          # altool failure, including a validation rejection, still fails the step. Widening this
          # to "any error mentioning the build number" would launder a real rejection into a green
          # step, which is the failure mode this workflow already paid for once with the
          # `workflow_run` gate that could never be true.
          if grep -qiE "ITMS-4238|Redundant Binary Upload" "$ALTOOL_LOG"; then
            echo "::notice::Apple already holds this build - the upload is a no-op, continuing"
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # altool can exit 0 even when its own payload reports a failed upload (e.g. an
          # asset-validation rejection), so the process exit code alone cannot be trusted -
          # also grep the transcript for altool's own failure markers.
          if [ "$ALTOOL_EXIT" -ne 0 ] || grep -qiE "UPLOAD FAILED|Error Domain=|VALIDATION_ERROR|NSLocalizedDescription" "$ALTOOL_LOG"; then
            echo "::error::altool reported a failed upload - see log above"
            exit 1
          fi
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          echo "✅ Uploaded to TestFlight"


      # ═══════════════════════════════════════════════════════════════════════════════════════════
      # AND THEN ACTUALLY SUBMIT IT - the half that was missing, and the only asymmetry left
      # between the two stores.
      #
      # `altool --upload-app` above hands Apple the binary and stops. The binary lands in
      # TestFlight, which is exactly right for a pre-release, and for a STABLE it left the release
      # one manual gesture short of shipped: somebody had to open App Store Connect, create the
      # version, attach the build and press Submit. Nothing asked for that gesture and nothing
      # reminded anybody of it, while the same release put Android on the Play `production` track by
      # itself. So a stable release was half-shipped by construction.
      #
      # ONLY FOR A STABLE, and not as a policy choice: `versionString` is a marketing version and
      # Apple refuses `0.15.0-alpha.1` outright. A pre-release's destination IS TestFlight, which
      # the upload above has already reached - there is nothing further to do for one.
      # AND A DEFERRED SUBMISSION IS NOT A FAILED ONE, WHICH IS THE WHOLE POINT OF THE EXIT CODE.
      #
      # Apple gives an app ONE non-terminal version slot. Release faster than Apple reviews - which
      # a hotfix does by definition - and the previous version is still sitting in it. The script
      # then refuses, correctly: cancelling a review is a human decision and no release script may
      # take it. That refusal used to leave through `exit 1` like any other, so this job went red,
      # and `production` in `release.yml` is a SUCCESS dependency on this workflow.
      #
      # SO A BUSY APPLE QUEUE SKIPPED THE PRODUCTION DEPLOY. It did, three times - v0.16.2, v0.16.3
      # and v0.16.4 - and nobody read it, because a red iOS arm had become the normal look of a
      # release. Production sat on v0.16.1 for three days while two releases reported themselves
      # shipped, and the third was the WASM outage: the fix reached the web only because a human
      # deployed it by hand.
      #
      # `production`'s dependency is right and stays. What was wrong is what it was reading. The
      # script now separates the two outcomes AS TYPES (`SlotHeldError` vs everything else), and
      # this step gives them different fates:
      #
      #   0   submitted, or already submitted        -> green, and the web may ship
      #   75  the slot is held by another version    -> green, and the web may ship. The binary is
      #                                                 in TestFlight; only Apple's queue is busy
      #   *   anything else                          -> RED, and the web must not ship a version a
      #                                                 store refused
      #
      # 75 IS NOT A MAGIC NUMBER HERE: it is `EXIT_SLOT_HELD` in `tools/app-store/submit.mjs`, and
      # `submit.test.mjs` reads this file to assert the two agree. A number duplicated into a
      # workflow is a number that drifts silently, so it is asserted instead of trusted.
      #
      # WHAT THIS IS NOT: a `continue-on-error`. That would swallow a genuine refusal too, which is
      # the failure this whole comment exists to prevent. A deferral is green because it is CORRECT,
      # not because failures here are tolerable.
      - name: Create the App Store version, attach the build, and submit for review
        id: submit
        if: inputs.publish && inputs.prerelease == 'false' && steps.testflight.outputs.uploaded == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_BUNDLE_ID: fr.emse.canari
          MARKETING_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ steps.outputs.outputs.build_number }}
        run: |
          set +e
          bun tools/app-store/submit.mjs
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "submitted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" -eq 75 ]; then
            echo "submitted=false" >> "$GITHUB_OUTPUT"
            {
              echo "### App Store submission deferred"
              echo
              echo "\`${MARKETING_VERSION}\` (build \`${BUILD_NUMBER}\`) is uploaded and available in"
              echo "TestFlight, but it was NOT submitted for review: Apple's single version slot is"
              echo "still held by an earlier version. The message above names it and its state."
              echo
              echo "**Nothing here needs fixing.** When that version leaves the slot - it ships, or a"
              echo "human withdraws it in App Store Connect - re-run this job and the submission goes"
              echo "through. The scheduled store-divergence check will keep saying so until it does."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit "$code"

      # LAST, AND THAT ORDERING IS THE FIX FOR SOMETHING THAT COST A WHOLE PLATFORM. It used to sit
      # BEFORE the store steps, so on `v0.16.0` this action was refused a release update
      # (`Resource not accessible by integration`, with `Contents: write` granted and printed by
      # the runner) and the two steps that actually SHIP - TestFlight and the App Store submission -
      # were `skipped` behind it. Production and Google Play both received 0.16.0; Apple received
      # nothing, and the run's only complaint was about a convenience.
      #
      # **A GITHUB RELEASE ASSET IS A CONVENIENCE; THE STORE IS THE DELIVERABLE.** So the store is
      # served first and this runs afterwards. Note what this is NOT: it is not a fix for the 403 -
      # that cause is unknown and is in `docs/wiki/backlog.md` - and it is not a
      # `continue-on-error`, which would swallow the failure. A refusal here still fails the job,
      # loudly. What changes is only what it can no longer take down with it.
      #
      # AND IT NO LONGER ASKS TO UPDATE THE RELEASE, WHICH IS ALL IT WAS EVER REFUSED (measured
      # 2026-09-04). `softprops/action-gh-release` FINDS the release and then PATCHES it, and the
      # 403 named that call: *"Unexpected error fetching GitHub release for tag refs/tags/v0.16.0"*,
      # pointing at `update-a-release`. Attaching a file needs no release update at all, so the
      # capability that was refused is one this step never wanted - which is the fix regardless of
      # WHY the PATCH was refused, and that cause is still unmeasured in `docs/wiki/backlog.md`.
      # `gh release upload` performs exactly the one call: POST to the release's assets.
      #
      # `--clobber` because a re-run of a release job must be able to replace the artefact it
      # already attached; without it the second run fails on the existing name, and re-running a
      # release whose chain died is the documented recovery.
      #
      # ONLY WHEN A PUBLISHED RELEASE IS WHAT STARTED THIS, and this is the one event test left in
      # this file for a reason. `release.yml` also has a hand-dispatched path, for re-running a
      # release whose chain died on an infrastructure fault; on that path a GitHub release for the
      # version may not exist. `gh release upload` FAILS there instead of creating one - the action
      # it replaces would have created a release, which would publish a release, which would start
      # `release.yml` again - but the condition stays: the question is about the caller's event.
      # Attach the artefact to the release that triggered this run, and to nothing else.
      - name: Upload to Release
        if: inputs.publish && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA: ${{ steps.outputs.outputs.ipa }}
          TAG: v${{ steps.release_tag.outputs.version }}
        run: gh release upload "$TAG" "$IPA" --clobber --repo "$GITHUB_REPOSITORY"

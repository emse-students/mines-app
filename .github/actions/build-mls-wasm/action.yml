name: Build MLS WASM
description: >
  Compile frontend/mls-wasm into frontend/src/lib/wasm. The output is a build artefact and is
  never committed, so EVERY pipeline that ships a client - web, Android, iOS - builds
  it here. One place, one pinned wasm-pack, one cache key: a client cannot be a crypto fix behind
  another without this file changing.

runs:
  using: composite
  steps:
    # Keyed on the sources, so an unchanged crate never pays for a rebuild and a changed one
    # can never miss it. mls-wasm is bindings over mls-core, so both crates are in the key.
    - name: Restore built WASM
      id: cache
      uses: actions/cache@v6
      with:
        path: frontend/src/lib/wasm
        key: mls-wasm-${{ runner.os }}-wp0.15.0-${{ hashFiles('frontend/mls-wasm/**', 'frontend/mls-core/**', 'rust-toolchain.toml') }}

    - name: Setup Rust
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: wasm32-unknown-unknown
        # The repository root holds no workspace manifest, so the default (`.`) makes the bundled
        # rust-cache run `cargo metadata` there and print `failed with exit code 101` on every
        # run - a red line that means nothing and teaches its reader to skip red lines.
        cache-workspaces: frontend/mls-wasm
        # THIS ACTION EXPORTS ITS `rustflags` INTO $GITHUB_ENV, so its default (`-D warnings`) does
        # not stay in this step - it becomes RUSTFLAGS for EVERY LATER STEP OF THE CALLING JOB. The
        # AppImage release of v0.14.1 died that way: `bun tauri build`, six steps down, compiled the
        # vendored `tao` patch under our lint bar and three upstream `glib::MainContext::channel`
        # deprecations became errors. A path dependency is the one kind Cargo does NOT `--cap-lints
        # allow`, so vendoring a crate silently opts its upstream code into our strictness.
        #
        # WORSE, IT WAS INTERMITTENT: every step here is gated on a WASM cache miss, so whether the
        # release built at all depended on whether a cache entry had expired. Emptying it here makes
        # the flag scoped to the one command that should carry it, below.
        rustflags: ''

    - name: Install wasm-pack
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: ./scripts/install-wasm-pack.sh

    - name: Build WASM
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend/mls-wasm
      # Where `-D warnings` belongs: on OUR crypto crates, and nowhere else. Registry dependencies
      # are lint-capped by Cargo, so this reaches mls-wasm and mls-core only.
      env:
        RUSTFLAGS: '-D warnings'
      run: wasm-pack build --target web --out-dir ../src/lib/wasm

    # A cache that restores an empty directory would otherwise be found by a module-resolution
    # error three steps later, in a job that has nothing to do with crypto. Say it here.
    #
    # AND REFUSE A WASM THAT CAN PANIC, which is the same question one step further on: the file
    # exists, and can it run? `mls-core` compiles for the host AND for wasm32, and a `std` API that
    # is missing on wasm32 still COMPILES there - `cargo check --target wasm32-unknown-unknown` is
    # green - then PANICS in the browser. v0.16.4 shipped `std::time::SystemTime::now()` inside
    # `load_or_create` that way: every web login unwound in MLS init and the login path reported it
    # as `auth_pin_mismatch`, so every user was told their correct PIN was wrong. Nothing between
    # the merge and the outage could see it.
    #
    # `std` reaches those shims through its per-platform unsupported module, whose panics all carry
    # one sentence, so this catches ANY missing API rather than the clock alone.
    #
    # NO `if:` ON THIS STEP, deliberately: it must also judge a CACHE HIT. The cache is keyed on the
    # crate sources, so an entry stored before this check existed restores an unjudged artefact, and
    # a gate that only runs on a rebuild is a gate a cache turns off.
    #
    # ONE IMPLEMENTATION, IN BASH, BECAUSE THIS IS THE ONE PLACE. This action is where every
    # pipeline builds the file, and it installs no runtime of its own - a second copy in a
    # `package.json` script would drift from this one on the day somebody edits the marker, and the
    # drift is invisible until it matters.
    - name: Verify the artefact
      shell: bash
      run: |
        if [ ! -s frontend/src/lib/wasm/mls_wasm_bg.wasm ]; then
          echo "::error::MLS WASM is missing after the build step (cache-hit=${{ steps.cache.outputs.cache-hit }})"
          exit 1
        fi
        ls -l frontend/src/lib/wasm/
        if grep -qa 'not implemented on this platform' frontend/src/lib/wasm/mls_wasm_bg.wasm; then
          # `std` prefixes the sentence with the API's own name ("time", "random", ...), which is
          # what turns this refusal into a lead rather than a verdict.
          FOUND=$(grep -ao '.\{0,40\}not implemented on this platform' \
                    frontend/src/lib/wasm/mls_wasm_bg.wasm | head -1 | tr -c '[:print:]' ' ')
          echo "::error::The built WASM can panic on wasm32: ...${FOUND}. A std API that does not exist on this target still compiles for it and panics at runtime, in the browser, on a path no test here covers. Gate the call behind #[cfg(not(target_arch = \"wasm32\"))], or take the value it needs (a clock, an entropy source) as a parameter from the caller, which has one on every target. See CHANGELOG v0.16.5."
          exit 1
        fi
        echo "wasm carries no unsupported-platform panic (cache-hit=${{ steps.cache.outputs.cache-hit }})"
